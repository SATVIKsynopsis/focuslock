[package]
name = "focuslock"
version = "0.1.0"
edition = "2024"
license-file = "LICENSE.md"

[dependencies]
tao = "0.37.3"
tray-icon = "0.26.1"
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "NSString", "NSNotification", "NSDictionary", "NSOperation", "NSGeometry", "NSArray", "NSObject", "NSValue", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSWorkspace", "NSRunningApplication", "NSApplication", "NSAlert", "NSTextField", "NSControl", "NSView", "NSResponder", "NSText", "NSWindow", "NSGraphics", "libc", "NSImage", "NSImageRep", "NSBitmapImageRep", "NSGraphicsContext"] }
serde = { version = "1", features = ["derive"] }
toml = "0.9"
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
url = "2"
wry = "0.57.3"
plist = "1.10.4"
